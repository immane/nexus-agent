destroy table inet gateway

table inet gateway {
    set non_global_v4 {
        type ipv4_addr
        flags interval
        elements = {
            0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8,
            169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24,
            192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16,
            198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24,
            224.0.0.0/4, 240.0.0.0/4
        }
    }

    set blocked_host_v4 {
        type ipv4_addr
        flags interval
    }

    chain input {
        type filter hook input priority filter; policy drop;
        meta nfproto ipv6 drop
        ct original ip daddr 127.0.0.11 udp dport 53 counter drop
        ct original ip daddr 127.0.0.11 tcp dport 53 counter drop
        iifname "lo" ip daddr 127.0.0.1 udp dport 53 accept
        iifname "lo" ip daddr 127.0.0.1 tcp dport 53 accept
        iifname "lo" udp dport 53 counter drop
        iifname "lo" tcp dport 53 counter drop
        iifname "lo" accept
        ip saddr @blocked_host_v4 counter drop
        ip saddr @non_global_v4 drop
        ct state established,related accept
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
    }

    chain output {
        type filter hook output priority filter; policy drop;
        meta nfproto ipv6 drop
        ct original ip daddr 127.0.0.11 udp dport 53 counter drop
        ct original ip daddr 127.0.0.11 tcp dport 53 counter drop
        oifname "lo" ip daddr 127.0.0.1 udp dport 53 accept
        oifname "lo" ip daddr 127.0.0.1 tcp dport 53 accept
        oifname "lo" udp dport 53 counter drop
        oifname "lo" tcp dport 53 counter drop
        oifname "lo" accept
        ip daddr @blocked_host_v4 counter drop
        ip daddr @non_global_v4 counter drop
        ip daddr 255.255.255.255 drop
        ct state established,related accept
        udp dport 53 ip daddr { 1.1.1.1, 1.0.0.1 } accept
        tcp dport 53 ip daddr { 1.1.1.1, 1.0.0.1 } accept
        udp dport 53 drop
        tcp dport 53 drop
        ip protocol != { tcp, udp, icmp } drop
        ip protocol tcp accept
        ip protocol udp accept
        ip protocol icmp accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

}
