[package]
name = "nexus-config"
version = "0.2.3-alpha"
edition = "2024"

[dependencies]
# Validated domain context-management types; config owns their JSON format.
nexus-core = { path = "../nexus-core" }
# Strict argument-text parsing reused for the config file: duplicate keys
# never last-win, and byte/depth/node budgets bound the document.
nexus-validation = { path = "../nexus-validation" }
# JSON file format only: parsing plus canonical serialization for saves.
serde_json = "1"
# Typed operational settings; user config stays strict JSON.
serde = { version = "1", features = ["derive"] }
