[package]
name = "nexus-tools"
version = "0.2.0-alpha"
edition = "2024"
autotests = false

[features]
default = []
container = []
container-worker = ["container"]

[[bin]]
name = "container-worker"
path = "src/bin/container-worker.rs"
required-features = ["container-worker"]

[[test]]
name = "behavior"
path = "tests/behavior.rs"

[dependencies]
nexus-permissions = { path = "../nexus-permissions" }
# Core domain types plus the synchronous tool port. Behavior (lifecycle,
# policy, events) stays in nexus-runtime; this crate only executes admitted
# calls against the real filesystem inside one rooted jail.
nexus-core = { path = "../nexus-core" }
# JSON for reading the admitted `{"path": ...}` arguments. No schema
# framework is added here; schemas are validated at registration.
serde = "1"
serde_json = "1"
rustix = { version = "1.1.5", features = ["event", "fs", "process"] }
