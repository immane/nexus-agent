[package]
name = "nexus-runtime"
version = "0.2.2-alpha"
edition = "2024"

[features]
default = []
container = []

[dependencies]
nexus-permissions = { path = "../nexus-permissions" }
# Core domain types plus the synchronous provider/tool ports (P2). All
# behavior (lifecycle, policy, events) lives in this crate.
nexus-core = { path = "../nexus-core" }
# Pure context estimation, selection, and derived-memory projection.
nexus-context = { path = "../nexus-context" }
# Closed M0 tool-schema/argument validator (lock section 4). Schemas compile
# once at registration; admitted arguments validate through it.
nexus-validation = { path = "../nexus-validation" }
nexus-session = { path = "../nexus-session" }
# JSON parsing for the policy boundary only: exact bounded argument previews
# and object checks. No schema framework is added here.
serde_json = "1"
# Single async runtime, minimal features only: `rt` (executor + blocking
# pool that adapts the sync core ports), `time` (monotonic
# sleeps/timeouts/deadlines), `sync` (bounded channels, mutex, cancel
# notification), `macros` (`select!` for responsive waits only). No
# net/io/fs/full features, no second runtime.
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
