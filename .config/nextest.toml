# nextest profile for this workspace: `cargo nextest run --workspace`.
#
# Why nextest: `cargo test` runs test binaries largely serially (a full
# workspace run can spend significant time building/linking test targets).
# nextest parallelizes tests; it does not remove Cargo build or discovery cost.
# Plain `cargo test` keeps working. Low-value targets are Cargo-feature gated
# and redundant individual checks are ignored; see docs/testing.md.

[profile.default]
# Flag timing regressions visibly without failing: nothing in the suite
# legitimately approaches this; the slowest timing gates sit near 1.5s.
slow-timeout = { period = "10s" }
